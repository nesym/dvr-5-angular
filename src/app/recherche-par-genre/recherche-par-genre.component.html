<div class="container">
  <div class="col-sm-4 col-md-4 col-lg-4 mb-4">
    <label>Genres</label>
    <select class="form-select form-select-lg" name="idGenre"
            [ngModel]="idGenre" (ngModelChange)="onChange($event)">
      <option [ngValue]="0">Tous les genres</option>
      @for (g of genres; track g.idGenre) {
        <option [ngValue]="g.idGenre">{{g.nomGenre}}</option>
      }
    </select>
  </div>

  <div class="card shadow mb-4">
    <div class="card-body">
      <table class="table table-striped">
        <tr>
          <th>Id</th><th>Pseudo</th><th>Score</th><th>Date Inscription</th><th>Genre</th>
        </tr>
        @for (gamer of gamers; track gamer.idGamer) {
          <tbody>
            <tr>
              <td>{{gamer.idGamer}}</td>
              <td>{{gamer.pseudoGamer}}</td>
              <td>{{gamer.scoreGamer}}</td>
              <td>{{gamer.dateInscription | date:'dd/MM/yyyy'}}</td>
              @if (gamer.genre) {
                <td>{{gamer.genre.nomGenre}}</td>
              } @else {
                <td>PAS DE GENRE</td>
              }
            </tr>
          </tbody>
        }
      </table>
    </div>
  </div>
</div>
